<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Amazon Smart Extractor</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 380px;
      min-height: 420px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
      background: linear-gradient(135deg, #0f0f1a 0%, #1a1a2e 50%, #16213e 100%);
      color: #e8e8ec;
      display: flex;
      flex-direction: column;
    }

    .container {
      padding: 24px;
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .header {
      text-align: center;
      margin-bottom: 28px;
      position: relative;
    }

    .logo {
      width: 56px;
      height: 56px;
      background: linear-gradient(135deg, #ff9900 0%, #ff6b00 100%);
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 16px;
      box-shadow: 0 8px 32px rgba(255, 153, 0, 0.3);
    }

    .logo svg {
      width: 28px;
      height: 28px;
      stroke: #0f0f1a;
      stroke-width: 2.5;
    }

    h1 {
      font-size: 1.4rem;
      font-weight: 700;
      background: linear-gradient(135deg, #ffffff 0%, #ff9900 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: -0.5px;
    }

    .subtitle {
      font-size: 0.8rem;
      color: #8b8ba3;
      margin-top: 4px;
      font-weight: 400;
    }

    .usage-counter {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 153, 0, 0.2);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      transition: all 0.3s ease;
    }

    .usage-counter.warning {
      border-color: rgba(255, 107, 107, 0.5);
      background: rgba(255, 107, 107, 0.08);
    }

    .usage-counter.locked {
      border-color: rgba(255, 107, 107, 0.7);
      background: rgba(255, 107, 107, 0.12);
    }

    .usage-info {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .usage-label {
      font-size: 0.75rem;
      color: #8b8ba3;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .usage-value {
      font-size: 1.5rem;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }

    .usage-value.free {
      color: #4ade80;
    }

    .usage-value.warning {
      color: #fbbf24;
    }

    .usage-value.locked {
      color: #fb7185;
    }

    .usage-bar {
      width: 60px;
      height: 6px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 3px;
      overflow: hidden;
      flex-shrink: 0;
      margin-left: 16px;
    }

    .usage-bar-fill {
      height: 100%;
      border-radius: 3px;
      transition: width 0.4s ease, background 0.3s ease;
      background: linear-gradient(90deg, #4ade80 0%, #22c55e 100%);
    }

    .usage-bar-fill.warning {
      background: linear-gradient(90deg, #fbbf24 0%, #f59e0b 100%);
    }

    .usage-bar-fill.locked {
      background: linear-gradient(90deg, #fb7185 0%, #ef4444 100%);
    }

    .extract-btn {
      width: 100%;
      padding: 16px 24px;
      background: linear-gradient(135deg, #ff9900 0%, #ff6b00 100%);
      border: none;
      border-radius: 12px;
      color: #0f0f1a;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      box-shadow: 0 4px 20px rgba(255, 153, 0, 0.4);
    }

    .extract-btn:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 8px 32px rgba(255, 153, 0, 0.5);
    }

    .extract-btn:active:not(:disabled) {
      transform: translateY(0);
    }

    .extract-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    .extract-btn .spinner {
      width: 20px;
      height: 20px;
      border: 2px solid rgba(15, 15, 26, 0.3);
      border-top-color: #0f0f1a;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      display: none;
    }

    .extract-btn.loading .spinner {
      display: block;
    }

    .extract-btn.loading .btn-text {
      display: none;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .result-panel {
      margin-top: 20px;
      padding: 16px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      display: none;
      flex-direction: column;
      gap: 12px;
      animation: slideUp 0.3s ease;
    }

    .result-panel.visible {
      display: flex;
    }

    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .result-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .result-title {
      font-size: 0.85rem;
      font-weight: 600;
      color: #a0a0b8;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .copy-btn {
      padding: 6px 12px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 8px;
      color: #e8e8ec;
      font-size: 0.75rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .copy-btn:hover {
      background: rgba(255, 255, 255, 0.15);
      border-color: rgba(255, 153, 0, 0.5);
    }

    .copy-btn.copied {
      background: rgba(76, 222, 128, 0.2);
      border-color: #4ade80;
      color: #4ade80;
    }

    .result-content {
      font-size: 0.85rem;
      line-height: 1.7;
      color: #d0d0dc;
      white-space: pre-wrap;
      word-wrap: break-word;
      font-family: 'SF Mono', 'Fira Code', monospace;
    }

    .result-content .field {
      margin-bottom: 8px;
    }

    .result-content .field:last-child {
      margin-bottom: 0;
    }

    .result-content .field-label {
      color: #ff9900;
      font-weight: 600;
    }

    .result-content .field-value {
      color: #e8e8ec;
      margin-left: 4px;
    }

    .error-panel {
      margin-top: 20px;
      padding: 16px;
      background: rgba(251, 113, 133, 0.12);
      border: 1px solid rgba(251, 113, 133, 0.3);
      border-radius: 12px;
      display: none;
      flex-direction: column;
      gap: 10px;
      animation: slideUp 0.3s ease;
    }

    .error-panel.visible {
      display: flex;
    }

    .error-icon {
      display: flex;
      align-items: center;
      gap: 8px;
      color: #fb7185;
    }

    .error-text {
      font-size: 0.85rem;
      color: #fda4af;
      line-height: 1.5;
    }

    /* Premium Lock Overlay */
    .premium-overlay {
      position: fixed;
      inset: 0;
      background: rgba(15, 15, 26, 0.98);
      backdrop-filter: blur(20px);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 24px;
      animation: fadeIn 0.3s ease;
    }

    .premium-overlay.visible {
      display: flex;
    }

    .premium-card {
      width: 100%;
      max-width: 340px;
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.05) 0%, rgba(255, 255, 255, 0.02) 100%);
      border: 1px solid rgba(255, 153, 0, 0.3);
      border-radius: 20px;
      padding: 32px;
      text-align: center;
      position: relative;
    }

    .premium-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: linear-gradient(90deg, #ff9900 0%, #ff6b00 100%);
    }

    .premium-icon {
      width: 64px;
      height: 64px;
      background: linear-gradient(135deg, rgba(255, 153, 0, 0.15) 0%, rgba(255, 107, 0, 0.15) 100%);
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px;
      border: 1px solid rgba(255, 153, 0, 0.3);
    }

    .premium-icon svg {
      width: 32px;
      height: 32px;
      stroke: #ff9900;
    }

    .premium-title {
      font-size: 1.25rem;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 8px;
    }

    .premium-subtitle {
      font-size: 0.9rem;
      color: #8b8ba3;
      margin-bottom: 24px;
      line-height: 1.5;
    }

    .premium-features {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 24px;
      text-align: left;
    }

    .premium-feature {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.85rem;
      color: #c0c0cc;
    }

    .premium-feature svg {
      width: 18px;
      height: 18px;
      stroke: #4ade80;
      flex-shrink: 0;
    }

    .license-input-group {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
    }

    .license-input {
      flex: 1;
      padding: 12px 16px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 10px;
      color: #e8e8ec;
      font-size: 0.85rem;
      font-family: 'SF Mono', 'Fira Code', monospace;
      text-align: center;
      letter-spacing: 1px;
      transition: all 0.2s ease;
    }

    .license-input:focus {
      outline: none;
      border-color: #ff9900;
      box-shadow: 0 0 0 3px rgba(255, 153, 0, 0.2);
    }

    .license-input::placeholder {
      color: #5a5a7a;
    }

    .verify-btn {
      padding: 12px 20px;
      background: linear-gradient(135deg, #ff9900 0%, #ff6b00 100%);
      border: none;
      border-radius: 10px;
      color: #0f0f1a;
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
      white-space: nowrap;
    }

    .verify-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 16px rgba(255, 153, 0, 0.4);
    }

    .purchase-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: #ff9900;
      font-size: 0.85rem;
      font-weight: 500;
      text-decoration: none;
      transition: all 0.2s ease;
      padding: 12px 24px;
      border: 1px solid rgba(255, 153, 0, 0.3);
      border-radius: 8px;
      background: transparent;
      cursor: pointer;
      margin-top: 8px;
      width: 100%;
      justify-content: center;
    }

    .purchase-btn:hover {
      background: rgba(255, 153, 0, 0.1);
      color: #ffb340;
    }

    .purchase-btn svg {
      width: 16px;
      height: 16px;
    }

    .close-overlay {
      position: absolute;
      top: 16px;
      right: 16px;
      width: 28px;
      height: 28px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: #8b8ba3;
      transition: all 0.2s ease;
    }

    .close-overlay:hover {
      background: rgba(255, 255, 255, 0.1);
      color: #e8e8ec;
    }

    .close-overlay svg {
      width: 16px;
      height: 16px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="logo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path>
          <polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline>
          <line x1="12" y1="22.08" x2="12" y2="12"></line>
        </svg>
      </div>
      <h1>Amazon Smart Extractor</h1>
      <p class="subtitle">Extract product data instantly</p>
    </div>

    <div class="usage-counter" id="usageCounter">
      <div class="usage-info">
        <span class="usage-label">Extractions Remaining</span>
        <span class="usage-value free" id="usageValue">5</span>
      </div>
      <div class="usage-bar">
        <div class="usage-bar-fill" id="usageBarFill" style="width: 100%"></div>
      </div>
    </div>

    <button class="extract-btn" id="extractBtn">
      <span class="btn-text">Extract Product Info</span>
      <span class="spinner"></span>
    </button>

    <div class="result-panel" id="resultPanel">
      <div class="result-header">
        <span class="result-title">Extracted Data</span>
        <button class="copy-btn" id="copyBtn">Copy</button>
      </div>
      <div class="result-content" id="resultContent"></div>
    </div>

    <div class="error-panel" id="errorPanel">
      <div class="error-icon">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="12" y1="8" x2="12" y2="12"></line>
          <line x1="12" y1="16" x2="12.01" y2="16"></line>
        </svg>
        <span class="error-text" id="errorText"></span>
      </div>
    </div>
  </div>

  <!-- Premium Lock Overlay -->
  <div class="premium-overlay" id="premiumOverlay">
    <div class="premium-card">
      <button class="close-overlay" id="closeOverlay" aria-label="Close">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
      <div class="premium-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
        </svg>
      </div>
      <h2 class="premium-title">Free Limit Reached</h2>
      <p class="premium-subtitle">You've used all 5 free extractions. Upgrade to Premium for unlimited access.</p>

      <div class="premium-features">
        <div class="premium-feature">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="20 6 9 17 4 12"></polyline>
          </svg>
          <span>Unlimited extractions</span>
        </div>
        <div class="premium-feature">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="20 6 9 17 4 12"></polyline>
          </svg>
          <span>Priority processing</span>
        </div>
        <div class="premium-feature">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="20 6 9 17 4 12"></polyline>
          </svg>
          <span>Export to CSV/JSON</span>
        </div>
      </div>

      <div class="license-input-group">
        <input type="text" class="license-input" id="licenseInput" placeholder="Enter license key" maxlength="24" spellcheck="false">
        <button class="verify-btn" id="verifyBtn">Verify</button>
      </div>

      <button class="purchase-btn" id="purchaseBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
          <polyline points="15 3 21 3 21 9"></polyline>
          <line x1="10" y1="14" x2="21" y2="3"></line>
        </svg>
        Purchase License on Lemon Squeezy
      </button>
    </div>
  </div>

  <script src="popup.obfuscated.js"></script>
</body>
</html>
